services:
  postgres:
    image: postgres:17-alpine
    environment:
      # Credenciales solo de desarrollo.
      POSTGRES_USER: vozmuni
      POSTGRES_PASSWORD: vozmuni
      POSTGRES_DB: vozmuni
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vozmuni-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vozmuni -d vozmuni"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vozmuni-pgdata:
